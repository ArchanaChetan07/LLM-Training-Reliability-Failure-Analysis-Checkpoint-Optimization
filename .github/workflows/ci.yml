name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m pyflakes src scripts tests examples
      - name: Unit tests
        run: python -m pytest -q
      - name: README numbers match committed results
        run: python scripts/check_readme_numbers.py
      - name: Calculator CLI smoke test
        run: ckpt-calc --gpus 992 --ckpt-cost 1m --restart 30m --preset opt175b --current 80m
